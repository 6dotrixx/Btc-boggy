name: live-arb-scan

# Manual one-shot: run the arb engine against LIVE public Kalshi data from a
# GitHub runner (open internet). Read-only, no keys, no orders.
on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Live arb scan
        run: PYTHONPATH=. python scripts/live_arb_scan.py
